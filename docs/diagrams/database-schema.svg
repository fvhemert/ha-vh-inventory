<text id="subtitle" x="80" y="121" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#000000" data-max-width="1640">8 application tables + SQLite internal storage. Solid arrows: foreign-key declarations. Dashed arrow: barcode matching.</text>
