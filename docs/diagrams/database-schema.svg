<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1860" viewBox="0 0 1800 1860" role="img" aria-labelledby="title description">
<title id="title">VH Inventory database tables and relationships</title>
<desc id="description">Workstreams: general. Eight application tables, five declared foreign keys, logical barcode matching, non-FK audit references, and SQLite internal sequence storage. Generated from the repository schema without accessing live data.</desc>
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>
