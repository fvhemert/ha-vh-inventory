<text id="stock-note-0" x="698" y="809" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="404">One product may have stock in several locations.</text>
<text id="stock-note-1" x="698" y="844" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="404">Quantity belongs to the stock row, not products.</text>
<text id="shopping-note-0" x="1298" y="820" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#000000" data-max-width="404">product_id set: catalogue item; ad-hoc fields NULL.</text>
<text id="shopping-note-1" x="1298" y="855" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#000000" data-max-width="404">product_id NULL: ad-hoc name and key required.</text>
<text id="rename-note" x="98" y="1124" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="404">Renaming keeps the same product id and links.</text>
<text id="history-note-0" x="1298" y="1424" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="404">entity + entity_id: logical audit reference.</text>
<text id="history-note-1" x="1298" y="1464" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="404">Different entity types; no foreign key.</text>
<text id="history-note-2" x="1298" y="1504" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="404">History can outlive the referenced row.</text>
<text id="legend-0" x="80" y="1279" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="560">PK = primary key. FK = declared foreign key.</text>
<text id="legend-1" x="80" y="1314" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="560">NN = NOT NULL. UQ = UNIQUE.</text>
<text id="legend-2" x="80" y="1349" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="560">UQ* = unique for non-NULL ad_hoc_key values.</text>
<text id="legend-3" x="80" y="1384" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="560">Each FK: many child rows to 0 or 1 parent.</text>
<text id="legend-4" x="80" y="1419" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="560">Columns allow NULL unless PK or NN.</text>
<text id="internal-note" x="80" y="1664" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="600">SQLite-managed AUTOINCREMENT counters; no FK.</text>
<text id="source-note" x="80" y="1714" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="1640">Source: pyscript\apps\vh_inventory\__init__.py | DB_SCHEMA, _ensure_schema, barcode lookup and history writer.</text>
<text id="constraints-note" x="80" y="1754" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="1640">Current schema definitions; migrated databases can retain older constraints. _conn() does not enable SQLite foreign-key enforcement.</text>
<text id="workstream-note" x="80" y="1794" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#000000" data-max-width="1640">Workstreams: general | Schema-only diagram. No live data accessed or database changes made.</text>
</svg>
